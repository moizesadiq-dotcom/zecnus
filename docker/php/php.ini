; Production PHP. Fail closed: display_errors off, strict sessions, bounded uploads.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
expose_php = Off
memory_limit = 256M
max_execution_time = 60
post_max_size = 20M
upload_max_filesize = 20M
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
