name: ci

# Nothing reaches GHCR/production unless this workflow is green.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.0 \
            detect --source=/repo --verbose --redact

  quality:
    name: PHP tests and Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, tokenizer, xml, ctype, json, bcmath
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Pint (changed PHP only)
        run: vendor/bin/pint --test tests database/factories/UserFactory.php app/Http/Controllers/ClientController.php
      - name: PHPUnit
        env:
          APP_ENV: testing
          APP_KEY: base64:2fl+pEtA2a+YdGZqS8nNq0q1o1m1n2o3p4q5r6s7t8u=
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan test --compact

  frontend:
    name: Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  image:
    name: Docker image and health
    needs: [secrets, quality, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: zecnus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: zecnus:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Container /up smoke
        env:
          APP_KEY: base64:2fl+pEtA2a+YdGZqS8nNq0q1o1m1n2o3p4q5r6s7t8u=
        run: |
          set -euo pipefail
          APP_KEY="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          docker run -d --name zecnus-ci \
            -e APP_KEY="$APP_KEY" \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_URL=http://127.0.0.1:8080 \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/var/www/html/database/database.sqlite \
            -e SESSION_DRIVER=file \
            -e CACHE_STORE=file \
            -e QUEUE_CONNECTION=sync \
            -e RUN_MIGRATIONS=false \
            -p 18080:8080 \
            zecnus:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/up; then
              docker rm -f zecnus-ci
              exit 0
            fi
            sleep 2
          done
          docker logs zecnus-ci
          docker rm -f zecnus-ci
          exit 1
