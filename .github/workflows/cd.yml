name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "CI green; publish allowed."

  publish:
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.VPS_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Copy compose file and start stack (no git on VPS)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          ssh-keyscan -H "${VPS_HOST}" >> "${HOME}/.ssh/known_hosts"
          SSH=(ssh -i "${HOME}/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -i "${HOME}/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "${VPS_USER}@${VPS_HOST}" "mkdir -p '${DEPLOY_PATH}'"
          "${SCP[@]}" docker-compose.prod.yml "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/docker-compose.yml"
          "${SCP[@]}" scripts/deploy/remote.sh "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/remote.sh"
          "${SSH[@]}" "${VPS_USER}@${VPS_HOST}" \
            "chmod +x '${DEPLOY_PATH}/remote.sh' && DEPLOY_PATH='${DEPLOY_PATH}' ZECNUS_IMAGE='${IMAGE}' GHCR_USER='${GITHUB_ACTOR}' GHCR_TOKEN='${GHCR_TOKEN}' bash '${DEPLOY_PATH}/remote.sh'"
